spring.application.name=societysync

# --- Database ---
# Default: H2 in-memory so the project runs with zero setup for development/demo.
# Swap to MySQL for real use by uncommenting the block below and commenting out the H2 lines.
spring.datasource.url=jdbc:h2:mem:societysync;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (production) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/societysync?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=CHANGE_ME

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# CHANGE THIS before deploying anywhere real. Must be at least 256 bits (32+ chars) for HS256.
app.jwt.secret=CHANGE_ME_this_is_a_dev_only_secret_key_replace_before_prod_use
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# --- CORS: allow the Vite dev server and any deployed frontend origin ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

server.port=8080
