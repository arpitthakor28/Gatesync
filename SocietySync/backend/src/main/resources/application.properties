spring.application.name=gatesync

# --- Server Port (dynamic for Render) ---
server.port=${PORT:8080}

# --- Database: Dual Strategy ---
# Relational (H2 / MySQL) for fast relational lookups
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:gatesync;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# MongoDB Atlas Persistence (Multi-tenant Documents, Notifications, Audit, Passes)
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://thakorarpitsinh:Gatesync@cluster0.xudh85e.mongodb.net/gatesync?retryWrites=true&w=majority}

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=30

# --- CORS: GitHub Pages + Local Dev ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173,https://arpitthakor28.github.io

# --- Firebase Admin / FCM (HTTP v1) ---
firebase.config.path=${FIREBASE_CONFIG_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:gatesync-pwa}

# --- Cloudinary Signed Uploads ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
