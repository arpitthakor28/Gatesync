<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GateSync - Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Encodes path and query to redirect to index.html with hash routing or query fallback
      var pathSegmentsToKeep = 1; // for /Gatesync/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to GateSync platform...</p>
  </body>
</html>
